# Zensical configuration for the terminux documentation site.
# Docs: https://zensical.org/docs/  ·  build: `make docs` (from the repo root)

[project]
# Paths are resolved relative to this file: sources in docs/src, built site
# in docs/site (gitignored).
docs_dir = "src"
site_dir = "site"
site_name = "terminux"
site_description = "A fast, reliable, cross-platform terminal with a Workspaces sidebar and tabbed terminals."
site_author = "Stefane Fermigier"
# The canonical published URL. Keep it a domain root: a path component
# here would also move the local preview under that path.
site_url = "https://terminux.lab.abilian.com/"
copyright = """
Copyright &copy; 2026 The terminux authors
"""

repo_url = "https://github.com/abilian/terminux"
repo_name = "abilian/terminux"

# Each section's landing page is a titled first entry so it gets its own
# row at the top of the left nav. Do NOT enable navigation.indexes: that
# feature folds the landing page into the section title and removes its
# row, which is exactly what we don't want.
nav = [
  { "Home" = [
    { "Home" = "index.md" },
    { "About" = "about.md" },
    { "Compared to…" = "compared.md" },
    { "FAQ" = "faq.md" },
  ] },
  { "Getting started" = [
    { "Installation" = "getting-started/index.md" },
    { "Configuration" = "getting-started/configuration.md" },
  ] },
  { "Guides" = [
    { "Overview" = "guides/index.md" },
    { "Workspaces & tabs" = "guides/workspaces-and-tabs.md" },
    { "Keyboard shortcuts" = "guides/keyboard-shortcuts.md" },
    { "Remote access" = "guides/remote.md" },
    { "Shell integration" = "guides/shell-integration.md" },
  ] },
  { "Developers" = [
    { "Overview" = "developers/index.md" },
    { "Architecture" = "developers/architecture.md" },
    { "HTTP & WebSocket API" = "developers/api.md" },
    { "Developing" = "developers/developing.md" },
    { "Packaging & distribution" = "developers/packaging.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/terminal"

[[project.theme.palette]]
scheme = "default"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/abilian/terminux"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
